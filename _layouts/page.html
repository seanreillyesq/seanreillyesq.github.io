---
layout: default
---

<!-- Page Header -->
<header class="intro-header{% if page.header_overlay %} has-overlay{% endif %}" style="background-image: url('{{ site.baseurl }}/{{ page.header-img }}')">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 offset-lg-2 col-md-10 offset-md-1">
                <div class="site-heading">
                    <h1>{% if page.header-title %}{{ page.header-title }}{% elsif page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
                    <hr class="small">
                    <span class="subheading">{{ page.description }}</span>
                    {% if paginator and paginator.page > 1 %}
                    <br><span class="subheading" style="font-size: 0.7em;">Page {{ paginator.page }} of {{ paginator.total_pages }}</span>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<div class="container">
    <div class="row">
        <div class="col-lg-8 offset-lg-2 col-md-10 offset-md-1 page-content">
            {{ content }}
        </div>
    </div>
</div>
